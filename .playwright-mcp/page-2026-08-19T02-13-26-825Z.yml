                              - text: ".mvp-page { background: #0b0f14; color: #f2f5e9; font-family: \"Arial Narrow\", \"Helvetica Neue\", Arial, sans-serif; margin-left: calc(50% - 50vw); overflow: hidden; width: 100vw; } .mvp-page * { box-sizing: border-box; } .mvp-page a { color: inherit; text-decoration: none; } .mvp-nav { align-items: center; border-bottom: 1px solid #283039; display: flex; gap: 24px; justify-content: space-between; margin: 0 auto; max-width: 1240px; min-height: 68px; padding: 12px 24px; width: calc(100% - 24px); } .mvp-brand { align-items: center; display: flex; font-size: 14px; font-weight: 750; gap: 10px; letter-spacing: -0.01em; white-space: nowrap; } .mvp-brand-mark { align-items: center; background: #c8ff4d; color: #11160d; display: inline-flex; font-family: Consolas, monospace; font-size: 11px; height: 30px; justify-content: center; letter-spacing: -0.04em; width: 38px; } .mvp-status { border: 1px solid #333c46; color: #aab3ba; font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.08em; padding: 7px 10px; text-transform: uppercase; white-space: nowrap; } .mvp-nav-cta { border-bottom: 1px solid #c8ff4d; color: #f2f5e9; font-size: 13px; font-weight: 700; padding: 7px 0; white-space: nowrap; } .mvp-hero { align-items: center; display: grid; gap: clamp(42px, 7vw, 104px); grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); margin: 0 auto; max-width: 1240px; min-height: min(780px, calc(100dvh - 68px)); padding: clamp(64px, 8vw, 112px) 24px; width: calc(100% - 24px); } .mvp-hero-copy { max-width: 640px; } .mvp-eyebrow { color: #c8ff4d; font-family: Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.11em; margin: 0 0 24px; text-transform: uppercase; } .mvp-hero h1 { color: #f2f5e9; font-size: clamp(48px, 6.2vw, 88px); font-weight: 760; letter-spacing: -0.065em; line-height: 0.94; margin: 0; max-width: 720px; } .mvp-hero-intro { color: #aeb7bd; font-size: clamp(16px, 1.5vw, 20px); line-height: 1.55; margin: 28px 0 0; max-width: 560px; } .mvp-actions { align-items: center; display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; } .mvp-button-primary, .mvp-button-secondary { align-items: center; display: inline-flex; font-size: 14px; font-weight: 750; justify-content: center; min-height: 48px; padding: 0 22px; white-space: nowrap; } .mvp-button-primary { background: #c8ff4d; color: #11160d; } .mvp-button-secondary { border: 1px solid #3a444e; color: #d8ded5; } .mvp-product-shot { background: #121820; border: 1px solid #34404b; box-shadow: 24px 24px 0 #151c23; margin: 0; padding: 10px; transform: rotate(1.2deg); } .mvp-product-shot img { aspect-ratio: 16 / 10; display: block; height: auto; object-fit: cover; object-position: top left; width: 100%; } .mvp-product-shot figcaption { align-items: center; color: #8e9aa3; display: flex; font-family: Consolas, monospace; font-size: 10px; gap: 12px; justify-content: space-between; letter-spacing: 0.04em; padding: 12px 4px 2px; } .mvp-product-shot figcaption strong { color: #c8ff4d; font-weight: 700; text-transform: uppercase; } .mvp-proof { border-bottom: 1px solid #283039; border-top: 1px solid #283039; margin: 0 auto; max-width: 1240px; padding: 26px 24px; width: calc(100% - 24px); } .mvp-proof > p { color: #7f8a93; font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.08em; margin: 0 0 22px; text-transform: uppercase; } .mvp-proof ul { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); list-style: none; margin: 0; padding: 0; } .mvp-proof li { align-items: center; display: flex; font-size: 13px; gap: 13px; } .mvp-proof li strong { color: #c8ff4d; font-family: Consolas, monospace; font-size: 11px; } .mvp-proof li span { color: #c6cdd1; } .mvp-method { margin: 0 auto; max-width: 1240px; padding: clamp(96px, 12vw, 160px) 24px; width: calc(100% - 24px); } .mvp-section-heading { max-width: 760px; } .mvp-section-heading h2, .mvp-final h2 { color: #f2f5e9; fon