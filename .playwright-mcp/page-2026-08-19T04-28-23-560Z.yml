                          - textbox "HTML to import" [ref=f47e266]:
                            - /placeholder: <article class="card">...</article>
                            - text: "<main class=\"mvp-page\" id=\"top\"> <nav class=\"mvp-nav\" aria-label=\"Primary navigation\"> <a class=\"mvp-brand\" href=\"#top\"> <span class=\"mvp-brand-mark\">CTB</span> <span>Code to Block</span> </a> <a class=\"mvp-nav-cta\" href=\"#start\">Try the builder</a> </nav> <section class=\"mvp-hero\"> <div class=\"mvp-hero-copy\"> <p class=\"mvp-eyebrow\">A visual WordPress builder for code-first teams</p> <h1>Code in. Blocks you can move.</h1> <p class=\"mvp-hero-intro\">Paste HTML and CSS, then rearrange every real element on a visual canvas without flattening your work.</p> <div class=\"mvp-actions\"> <a class=\"mvp-button-primary\" href=\"#start\">Build a page</a> <a class=\"mvp-button-secondary\" href=\"#method\">See the workflow</a> </div> </div> <figure class=\"mvp-product-shot\"> <img src=\"http://localhost:8090/wp-content/uploads/2026/08/phase-3-canvas-desktop.png\" alt=\"Code to Block editor showing a draggable pricing card canvas\"> <figcaption> <strong>Live canvas</strong> <span>HTML + CSS becomes editable structure</span> </figcaption> </figure> </section> <section class=\"mvp-proof\" aria-label=\"Product principles\"> <p>Designed around three non-negotiables</p> <ul> <li><strong>01</strong><span>Real HTML semantics</span></li> <li><strong>02</strong><span>Resolved CSS fidelity</span></li> <li><strong>03</strong><span>WordPress-native saves</span></li> </ul> </section> <section class=\"mvp-method\" id=\"method\"> <div class=\"mvp-section-heading\"> <h2>Code becomes a working page in three moves.</h2> <p>No proprietary canvas export. The block tree stays inspectable, editable, and ready to render.</p> </div> <ol class=\"mvp-steps\"> <li> <span>01 / Import</span> <h3>Paste the source</h3> <p>Bring one HTML root and its CSS. The parser resolves specificity before anything reaches the canvas.</p> </li> <li> <span>02 / Shape</span> <h3>Move real elements</h3> <p>Drag to reorder or nest. Headings, links, lists, images, and containers remain separate blocks.</p> </li> <li> <span>03 / Publish</span> <h3>Save to WordPress</h3> <p>The tree persists through authenticated REST routes and renders with a static, scoped stylesheet.</p> </li> </ol> </section> <section class=\"mvp-features\" id=\"features\"> <article class=\"mvp-feature mvp-feature-code\"> <div> <span class=\"mvp-feature-number\">A</span> <h3>Specificity is settled before editing.</h3> <p>Selectors, inheritance, and inline declarations resolve into a stable style map for each element.</p> </div> <pre><code>.card .title { color: blue; } h2 { color: black; } resolved → blue</code></pre> </article> <article class=\"mvp-feature mvp-feature-tree\"> <span class=\"mvp-feature-number\">B</span> <h3>The structure stays visible.</h3> <p>Every dashed outline is a block you can select, move, restyle, and save.</p> <div class=\"mvp-tree-map\" aria-label=\"Example block hierarchy\"> <strong>section.hero</strong> <span>div.content</span> <span>h1.heading</span> <span>a.cta</span> </div> </article> <article class=\"mvp-feature mvp-feature-output\"> <span class=\"mvp-feature-number\">C</span> <h3>Frontend output stays fast.</h3> <p>Content-hashed CSS is generated when you save, not recalculated on every public request.</p> <p class=\"mvp-output-line\"><strong>Save once</strong><span>Serve static HTML + CSS</span></p> </article> </section> <section class=\"mvp-final\" id=\"start\"> <p>Minimum viable builder. Maximum structural honesty.</p> <h2>Make your next code sample editable.</h2> <a class=\"mvp-button-primary\" href=\"/wp-admin/post-new.php?post_type=ctb_page\">Build a page</a> </section> <footer class=\"mvp-footer\"> <a class=\"mvp-brand\" href=\"#top\"> <span class=\"mvp-brand-mark\">CTB</span> <span>Code to Block</span> </a> <p>HTML in. Editable WordPress pages out.</p> <a href=\"#method\">How it works</a> </footer> </main>"
